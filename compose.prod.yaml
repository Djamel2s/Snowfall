# Surcouche de production :
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
# Prérequis : certificats TLS dans infra/tls (non versionnés), DNS, secrets
# injectés par le gestionnaire de secrets (pas de .env en clair sur le serveur).
# Seul nginx (web) est exposé ; API, base et Keycloak restent sur le réseau
# interne (Keycloak est publié via son propre reverse proxy).
#
# Réseaux : « backend » est interne (aucune route vers Internet). L'API, la
# base, ClamAV n'y sont que là ; leur seule sortie est le proxy « egress »
# (Squid), qui n'autorise que les domaines listés dans infra/egress.

# Journaux : fichiers json-file bornés, étiquetés du nom du conteneur (lus
# par Alloy sans accès au socket Docker).
x-logging: &logging
  driver: json-file
  options:
    tag: "{{.Name}}"
    max-size: "20m"
    max-file: "5"

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: *logging

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24

services:
  db:
    # Aucune exposition réseau hors du réseau Docker, aucun accès à Internet.
    ports: !reset []
    networks: [backend]
    logging: *logging
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.3
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    volumes:
      - ./infra/tls/postgres:/etc/postgresql/tls:ro

  keycloak:
    # Mode production : HTTPS obligatoire, hostname strict, pas de H2.
    # Réseau public (fédération d'identité, SMTP) et interne (base, API).
    networks: [default, backend]
    logging: *logging
    command: start --import-realm
    ports: !override
      - "127.0.0.1:8443:8443"
    extra_hosts: !reset []
    environment:
      KC_HOSTNAME: ${KC_HOSTNAME:?Define KC_HOSTNAME (ex. https://auth.example.com)}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/tls/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/tls/server.key
      KC_PROXY_HEADERS: xforwarded
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak?sslmode=verify-full&sslrootcert=/opt/keycloak/conf/tls/ca.crt
      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: "true"
      SNOWFALL_KC_SSL_REQUIRED: all
      SNOWFALL_APP_ORIGIN: ${APP_ORIGIN:?Define APP_ORIGIN (https://...)}
      # Keycloak joint l'API directement sur le réseau interne.
      SNOWFALL_BACKCHANNEL_LOGOUT_URL: http://api:3001/auth/backchannel-logout
      SNOWFALL_SMTP_HOST: ${SMTP_HOST:?Define SMTP_HOST}
      SNOWFALL_SMTP_PORT: ${SMTP_PORT:-587}
      SNOWFALL_SMTP_FROM: ${SMTP_FROM:?Define SMTP_FROM}
      SNOWFALL_SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SNOWFALL_SMTP_SSL: ${SMTP_SSL:-false}
      SNOWFALL_SMTP_AUTH: "true"
      SNOWFALL_SMTP_USER: ${SMTP_USER:?Define SMTP_USER}
      SNOWFALL_SMTP_PASSWORD: ${SMTP_PASSWORD:?Define SMTP_PASSWORD}
    volumes:
      - ./infra/tls/keycloak:/opt/keycloak/conf/tls:ro

  # Mailpit sert au développement uniquement.
  mailpit:
    profiles: ["dev"]

  migrate:
    <<: *hardened
    build: { context: ., dockerfile: apps/api/Dockerfile, target: migrate }
    restart: "no"
    profiles: ["migrate"]
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?Define DATABASE_MIGRATION_URL}
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL}
    tmpfs: ["/tmp", "/home/node/.npm"]

  api:
    <<: *hardened
    build: { context: ., dockerfile: apps/api/Dockerfile, target: runtime }
    depends_on:
      db: { condition: service_healthy }
      clamav: { condition: service_healthy }
      egress: { condition: service_started }
    # Réseau interne seulement : Internet uniquement via le proxy de sortie.
    networks: [backend]
    tmpfs: ["/tmp"]
    # secret_id AppRole : fichier monté en lecture seule, jamais en variable.
    secrets: [vault_secret_id]
    # Groupe du socket du bac à sable (interpréteur de code).
    group_add: ["10010"]
    volumes:
      - ./infra/tls/ca.crt:/etc/snowfall/ca.crt:ro
      - snowfall_sandbox_socket:/run/sandbox
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Define APP_ORIGIN (https://...)}
      # nginx est le seul proxy de confiance (adresse fixe sur le réseau interne).
      TRUST_PROXY: 172.31.0.10
      # Sorties : fournisseurs d'IA et OIDC par HTTPS_PROXY (pris en charge
      # nativement par Node), import de liens par EGRESS_PROXY_URL.
      NODE_USE_ENV_PROXY: "1"
      HTTPS_PROXY: http://egress:3128
      HTTP_PROXY: http://egress:3128
      NO_PROXY: localhost,127.0.0.1,db,keycloak,clamav,vault,egress,searxng
      EGRESS_PROXY_URL: http://egress:3128
      # Recherche web (profil « web-search ») : http://searxng:8080 ; vide = indisponible.
      WEB_SEARCH_URL: ${WEB_SEARCH_URL:-}
      # Interpréteur de code (profil « code ») : /run/sandbox/sandbox.sock ; vide = indisponible.
      SANDBOX_SOCKET: ${SANDBOX_SOCKET:-}
      # Serveurs MCP (approuvés par les admins ; domaines dans infra/egress/mcp-domains.txt).
      MCP_ENABLED: ${MCP_ENABLED:-false}
      # Antivirus obligatoire : un fichier non analysable est refusé.
      ANTIVIRUS: clamav
      CLAMAV_HOST: clamav
      KNOWLEDGE_LINKS: ${KNOWLEDGE_LINKS:-on}
      # IA locale (profil « local-ai ») : embeddings et reclassement sur la
      # plateforme, seuls autorisés pour les bases confidentielles. Activer :
      # LOCAL_EMBEDDING_BASE_URL=http://embeddings/v1, LOCAL_EMBEDDING_MODEL=BAAI/bge-m3,
      # RERANK_BASE_URL=http://reranker.
      LOCAL_EMBEDDING_BASE_URL: ${LOCAL_EMBEDDING_BASE_URL:-}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANK_API: ${RERANK_API:-tei}
      RERANK_CANDIDATES: ${RERANK_CANDIDATES:-10}
      # Métriques Prometheus : port interne, jeton en plus du réseau.
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: "9464"
      METRICS_TOKEN: ${METRICS_TOKEN:?Define METRICS_TOKEN (même valeur que infra/secrets/metrics_token)}
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL (sslmode=verify-full)}
      OIDC_ISSUER: ${OIDC_ISSUER:?Define OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-snowfall-bff}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Define OIDC_CLIENT_SECRET}
      OIDC_EXTRA_SCOPES: ${OIDC_EXTRA_SCOPES:-organization}
      SNOWFALL_MASTER_KEY: ${SNOWFALL_MASTER_KEY:?Define SNOWFALL_MASTER_KEY}
      KMS_PROVIDER: ${KMS_PROVIDER:-vault}
      # OpenBao interne (profil « kms ») ou Vault externe (ajouter son nom à
      # infra/egress/allowed-domains.txt). Certificat d'AC privée : NODE_EXTRA_CA_CERTS.
      VAULT_ADDR: ${VAULT_ADDR:-https://openbao:8200}
      VAULT_AUTH: approle
      VAULT_ROLE_ID: ${VAULT_ROLE_ID:?Define VAULT_ROLE_ID (infra/openbao/bootstrap.sh)}
      VAULT_SECRET_ID_FILE: /run/secrets/vault_secret_id
      VAULT_NAMESPACE: ${VAULT_NAMESPACE:-}
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-/etc/snowfall/ca.crt}
      REDIS_URL: ${REDIS_URL:-}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:?Define LLM_DEFAULT_MODEL}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AUDIT_STDOUT: "true"
      SIEM_WEBHOOK_URL: ${SIEM_WEBHOOK_URL:-}
      SIEM_WEBHOOK_TOKEN: ${SIEM_WEBHOOK_TOKEN:-}
      SIEM_FORMAT: ${SIEM_FORMAT:-json}

  # KMS interne (facultatif : profil « kms »). Initialisation unique :
  #   bao operator init (clés de descellement réparties entre plusieurs
  #   personnes), bao operator unseal ×3, puis infra/openbao/bootstrap.sh.
  openbao:
    <<: *hardened
    image: openbao/openbao:2.6.4@sha256:cf2340fc9a22cb9358ca0defd1f39b65673836bd23fe2bb8984a07e11fe13ef4
    profiles: ["kms"]
    user: "100:1000"
    networks: [backend]
    command: ["server", "-config=/openbao/config/config.hcl"]
    environment:
      BAO_ADDR: https://127.0.0.1:8200
      BAO_CACERT: /openbao/tls/ca.crt
    tmpfs: ["/tmp"]
    volumes:
      - snowfall_openbao_data:/openbao/data
      - ./infra/openbao/config.hcl:/openbao/config/config.hcl:ro
      - ./infra/openbao:/openbao/bootstrap:ro
      - ./infra/tls/openbao:/openbao/tls:ro

  # Antivirus : réseau interne, signatures mises à jour via le proxy de sortie.
  clamav:
    <<: *hardened
    image: clamav/clamav:1.5.4_base@sha256:96b28b83eb72fb497c2400a94229844226e5fe4da9061fad1988092d9fcd88f3
    entrypoint: ["/init-unprivileged"]
    user: "100:101"
    # Toujours actif en production (le profil « antivirus » sert au dev),
    # jamais publié sur l'hôte.
    profiles: !reset []
    ports: !reset []
    networks: [backend]
    depends_on: [egress]
    environment:
      FRESHCLAM_CHECKS: "12"
    tmpfs: ["/tmp:uid=100,gid=101", "/var/log/clamav:uid=100,gid=101"]
    volumes:
      - snowfall_clamav_db:/var/lib/clamav
      - ./infra/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - ./infra/clamav/freshclam.prod.conf:/etc/clamav/freshclam.conf:ro
    deploy:
      resources:
        limits: { memory: 3g }
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 10m
      retries: 3

  # Proxy de sortie : seule voie vers Internet du réseau interne. Liste des
  # domaines autorisés dans infra/egress/*.txt ; journal sur la sortie standard.
  egress:
    <<: *hardened
    image: ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
    user: "13:13"
    networks:
      default: {}
      backend: { ipv4_address: 172.31.0.5 }
    tmpfs:
      - /run/squid:uid=13,gid=13
      - /var/spool/squid:uid=13,gid=13
      - /var/log/squid:uid=13,gid=13
      - /tmp:uid=13,gid=13
    volumes:
      - ./infra/egress/squid.conf:/etc/squid/squid.conf:ro
      - ./infra/egress/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro
      - ./infra/egress/knowledge-domains.txt:/etc/squid/knowledge-domains.txt:ro
      - ./infra/egress/search-domains.txt:/etc/squid/search-domains.txt:ro
      - ./infra/egress/mcp-domains.txt:/etc/squid/mcp-domains.txt:ro

  # ---- Interpréteur de code des agents (profil « code ») ---------------------
  # Aucun réseau : l'API lui parle par un socket Unix (volume partagé, réservé
  # au groupe 10010). Chaque exécution : utilisateur dédié, dossier neuf, limites
  # CPU/mémoire/processus/fichiers, tout tué à la fin. init (tini) récupère les
  # processus orphelins. En production, gVisor isole aussi du noyau :
  # SANDBOX_RUNTIME=runsc (runtime installé sur l'hôte). Activer côté API :
  # SANDBOX_SOCKET=/run/sandbox/sandbox.sock.
  sandbox:
    build: { context: apps/sandbox }
    profiles: ["code"]
    runtime: ${SANDBOX_RUNTIME:-runc}
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL, CHOWN]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    logging: *logging
    tmpfs:
      - /work:size=256m,mode=0711
      - /tmp:size=16m,mode=0700
      - /dev/shm:size=16m,mode=0700
    volumes:
      - snowfall_sandbox_socket:/run/sandbox

  # ---- Recherche web des agents (profil « web-search ») ----------------------
  # Métamoteur privé : l'API l'interroge en JSON sur le réseau interne ; lui
  # seul sort, par le proxy, et seulement vers les moteurs listés
  # (infra/egress/search-domains.txt). Activer côté API : WEB_SEARCH_URL=http://searxng:8080.
  searxng:
    <<: *hardened
    image: searxng/searxng:2026.10.2-19ffbcd30@sha256:c642712fcedcdaa78fac44f71eada86aff510745826ba1bd1a368211fea2ce7f
    profiles: ["web-search"]
    networks:
      backend: { ipv4_address: 172.31.0.20 }
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    tmpfs: ["/tmp", "/var/cache/searxng"]
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro

  # ---- IA locale (profil « local-ai ») ---------------------------------------
  # Text Embeddings Inference (Hugging Face), CPU. Premier démarrage : les
  # modèles (~2,3 Go chacun) sont téléchargés via le proxy de sortie (activer
  # temporairement les domaines Hugging Face dans infra/egress), puis servis
  # hors ligne depuis le volume. Pour un GPU : image « cuda-1.9.4 ».
  embeddings:
    <<: *hardened
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    profiles: ["local-ai"]
    networks: [backend]
    # Lots de 2 048 tokens : au-delà, le préchauffage ONNX sur CPU dépasse 6 Go
    # (mesuré). Usage observé : ~4,5 Go.
    command: ["--model-id", "BAAI/bge-m3", "--max-client-batch-size", "32", "--max-batch-tokens", "2048", "--auto-truncate"]
    environment:
      HTTPS_PROXY: http://egress:3128
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    tmpfs: ["/tmp"]
    volumes:
      - snowfall_models:/data
    deploy:
      resources:
        limits: { memory: 8g }

  reranker:
    <<: *hardened
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    profiles: ["local-ai"]
    networks: [backend]
    command: ["--model-id", "BAAI/bge-reranker-v2-m3", "--max-client-batch-size", "64", "--auto-truncate"]
    environment:
      HTTPS_PROXY: http://egress:3128
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    tmpfs: ["/tmp"]
    volumes:
      - snowfall_models:/data
    deploy:
      resources:
        limits: { memory: 6g }

  # ---- Sauvegardes --------------------------------------------------------
  # Chaque jour à BACKUP_HOUR (UTC), chiffrées pour les clés publiques age de
  # infra/secrets/backup_recipients (clé hors site + clé de test), copie hors
  # site si BACKUP_REMOTE est défini (rclone ; configuration dans un secret).
  backup:
    <<: *hardened
    build: { context: infra/backup }
    # Copie hors site par le proxy de sortie (ajouter le point d'accès du
    # stockage, ex. s3.fr-par.scw.cloud, à infra/egress/allowed-domains.txt).
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }
    environment:
      BACKUP_DB_HOST: db
      BACKUP_DB_SSLMODE: verify-full
      PGSSLROOTCERT: /etc/snowfall/ca.crt
      BACKUP_HOUR: ${BACKUP_HOUR:-02}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-35}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      RCLONE_CONFIG: /run/secrets/rclone_config
      HTTPS_PROXY: http://egress:3128
    tmpfs: ["/tmp:uid=70,gid=70"]
    secrets: [backup_db_password, backup_recipients, rclone_config]
    volumes:
      - ./backups:/backups
      - ./infra/tls/ca.crt:/etc/snowfall/ca.crt:ro

  # Test de restauration mensuel (preuve d'audit) :
  #   docker compose -f compose.yaml -f compose.prod.yaml run --rm backup-verify
  # Utilise la clé privée de test (jamais la clé hors site), sans réseau.
  backup-verify:
    <<: *hardened
    build: { context: infra/backup }
    profiles: ["verify"]
    restart: "no"
    network_mode: none
    command: ["restore-test.sh"]
    tmpfs: ["/tmp:uid=70,gid=70"]
    secrets: [backup_restore_identity]
    volumes:
      - ./backups:/backups:ro

  # ---- Supervision ----------------------------------------------------------
  prometheus:
    <<: *hardened
    image: prom/prometheus:v3.13.4@sha256:87861b8cf91579109319ebc300f3f1060e6da9c05d6ae8ad15a20c879e84e32e
    networks: [backend]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.enable-lifecycle=false
    secrets: [metrics_token]
    volumes:
      - snowfall_prometheus_data:/prometheus
      - ./infra/monitoring/prometheus:/etc/prometheus:ro

  alertmanager:
    <<: *hardened
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    # Réseau public pour l'envoi des e-mails d'alerte.
    networks: [backend, default]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    secrets: [alertmanager_smtp_password]
    volumes:
      - snowfall_alertmanager_data:/alertmanager
      - ./infra/monitoring/alertmanager:/etc/alertmanager:ro

  loki:
    <<: *hardened
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    networks: [backend]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - snowfall_loki_data:/loki
      - ./infra/monitoring/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - ./infra/monitoring/loki/rules:/etc/loki/rules:ro

  # Collecte des journaux : lecture seule des fichiers de Docker, pas de socket.
  alloy:
    <<: *hardened
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    networks: [backend]
    user: "0:0"
    command: ["run", "--storage.path=/var/lib/alloy", "--server.http.listen-addr=127.0.0.1:12345", "/etc/alloy/config.alloy"]
    tmpfs: ["/var/lib/alloy", "/tmp"]
    volumes:
      - ./infra/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

  postgres-exporter:
    <<: *hardened
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    networks: [backend]
    environment:
      DATA_SOURCE_URI: db:5432/snowfall?sslmode=verify-full&sslrootcert=/etc/snowfall/ca.crt
      DATA_SOURCE_USER: snowfall_monitor
      DATA_SOURCE_PASS_FILE: /run/secrets/monitor_db_password
    secrets: [monitor_db_password]
    volumes:
      - ./infra/tls/ca.crt:/etc/snowfall/ca.crt:ro

  # Tableaux de bord : uniquement sur la boucle locale (tunnel SSH ou VPN).
  grafana:
    <<: *hardened
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    networks: [backend, default]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    tmpfs: ["/tmp"]
    secrets: [grafana_admin_password]
    volumes:
      - snowfall_grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  web:
    <<: *hardened
    build: { context: ., dockerfile: apps/web/Dockerfile }
    depends_on: [api]
    networks:
      default: {}
      backend: { ipv4_address: 172.31.0.10 }
    ports:
      - "443:8443"
      - "80:8080"
    # nginx (non root) n'écrit que son cache et son PID.
    tmpfs: ["/var/cache/nginx:uid=101,gid=101", "/tmp"]
    volumes:
      - ./infra/tls/web:/etc/nginx/tls:ro

volumes:
