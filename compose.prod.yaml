# Surcouche de production :
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
# Prérequis : certificats TLS dans infra/tls (non versionnés), DNS, secrets
# injectés par le gestionnaire de secrets (pas de .env en clair sur le serveur).
# Seul nginx (web) est exposé ; API, base et Keycloak restent sur le réseau
# interne (Keycloak est publié via son propre reverse proxy).
#
# Réseaux : « backend » est interne (aucune route vers Internet). L'API, la
# base, ClamAV n'y sont que là ; leur seule sortie est le proxy « egress »
# (Squid), qui n'autorise que les domaines listés dans infra/egress.

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24

services:
  db:
    # Aucune exposition réseau hors du réseau Docker, aucun accès à Internet.
    ports: !reset []
    networks: [backend]
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/tls/server.key
      - -c
      - ssl_min_protocol_version=TLSv1.3
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    volumes:
      - ./infra/tls/postgres:/etc/postgresql/tls:ro

  keycloak:
    # Mode production : HTTPS obligatoire, hostname strict, pas de H2.
    # Réseau public (fédération d'identité, SMTP) et interne (base, API).
    networks: [default, backend]
    command: start --import-realm
    ports: !override
      - "127.0.0.1:8443:8443"
    extra_hosts: !reset []
    environment:
      KC_HOSTNAME: ${KC_HOSTNAME:?Define KC_HOSTNAME (ex. https://auth.example.com)}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/tls/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/tls/server.key
      KC_PROXY_HEADERS: xforwarded
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak?sslmode=verify-full&sslrootcert=/opt/keycloak/conf/tls/ca.crt
      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: "true"
      SNOWFALL_KC_SSL_REQUIRED: all
      SNOWFALL_APP_ORIGIN: ${APP_ORIGIN:?Define APP_ORIGIN (https://...)}
      # Keycloak joint l'API directement sur le réseau interne.
      SNOWFALL_BACKCHANNEL_LOGOUT_URL: http://api:3001/auth/backchannel-logout
      SNOWFALL_SMTP_HOST: ${SMTP_HOST:?Define SMTP_HOST}
      SNOWFALL_SMTP_PORT: ${SMTP_PORT:-587}
      SNOWFALL_SMTP_FROM: ${SMTP_FROM:?Define SMTP_FROM}
      SNOWFALL_SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SNOWFALL_SMTP_SSL: ${SMTP_SSL:-false}
      SNOWFALL_SMTP_AUTH: "true"
      SNOWFALL_SMTP_USER: ${SMTP_USER:?Define SMTP_USER}
      SNOWFALL_SMTP_PASSWORD: ${SMTP_PASSWORD:?Define SMTP_PASSWORD}
    volumes:
      - ./infra/tls/keycloak:/opt/keycloak/conf/tls:ro

  # Mailpit sert au développement uniquement.
  mailpit:
    profiles: ["dev"]

  migrate:
    <<: *hardened
    build: { context: ., dockerfile: apps/api/Dockerfile, target: migrate }
    restart: "no"
    profiles: ["migrate"]
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?Define DATABASE_MIGRATION_URL}
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL}
    tmpfs: ["/tmp", "/home/node/.npm"]

  api:
    <<: *hardened
    build: { context: ., dockerfile: apps/api/Dockerfile, target: runtime }
    depends_on:
      db: { condition: service_healthy }
      clamav: { condition: service_healthy }
      egress: { condition: service_started }
    # Réseau interne seulement : Internet uniquement via le proxy de sortie.
    networks: [backend]
    tmpfs: ["/tmp"]
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Define APP_ORIGIN (https://...)}
      # nginx est le seul proxy de confiance (adresse fixe sur le réseau interne).
      TRUST_PROXY: 172.31.0.10
      # Sorties : fournisseurs d'IA et OIDC par HTTPS_PROXY (pris en charge
      # nativement par Node), import de liens par EGRESS_PROXY_URL.
      NODE_USE_ENV_PROXY: "1"
      HTTPS_PROXY: http://egress:3128
      HTTP_PROXY: http://egress:3128
      NO_PROXY: localhost,127.0.0.1,db,keycloak,clamav,vault,egress
      EGRESS_PROXY_URL: http://egress:3128
      # Antivirus obligatoire : un fichier non analysable est refusé.
      ANTIVIRUS: clamav
      CLAMAV_HOST: clamav
      KNOWLEDGE_LINKS: ${KNOWLEDGE_LINKS:-on}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      DATABASE_URL: ${DATABASE_URL:?Define DATABASE_URL (sslmode=verify-full)}
      OIDC_ISSUER: ${OIDC_ISSUER:?Define OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-snowfall-bff}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Define OIDC_CLIENT_SECRET}
      OIDC_EXTRA_SCOPES: ${OIDC_EXTRA_SCOPES:-organization}
      SNOWFALL_MASTER_KEY: ${SNOWFALL_MASTER_KEY:?Define SNOWFALL_MASTER_KEY}
      KMS_PROVIDER: ${KMS_PROVIDER:-vault}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      VAULT_NAMESPACE: ${VAULT_NAMESPACE:-}
      REDIS_URL: ${REDIS_URL:-}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:?Define LLM_DEFAULT_MODEL}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      AUDIT_STDOUT: "true"
      SIEM_WEBHOOK_URL: ${SIEM_WEBHOOK_URL:-}
      SIEM_WEBHOOK_TOKEN: ${SIEM_WEBHOOK_TOKEN:-}
      SIEM_FORMAT: ${SIEM_FORMAT:-json}

  # Antivirus : réseau interne, signatures mises à jour via le proxy de sortie.
  clamav:
    <<: *hardened
    image: clamav/clamav:1.5.4_base@sha256:96b28b83eb72fb497c2400a94229844226e5fe4da9061fad1988092d9fcd88f3
    entrypoint: ["/init-unprivileged"]
    user: "100:101"
    # Toujours actif en production (le profil « antivirus » sert au dev),
    # jamais publié sur l'hôte.
    profiles: !reset []
    ports: !reset []
    networks: [backend]
    depends_on: [egress]
    environment:
      FRESHCLAM_CHECKS: "12"
    tmpfs: ["/tmp:uid=100,gid=101", "/var/log/clamav:uid=100,gid=101"]
    volumes:
      - snowfall_clamav_db:/var/lib/clamav
      - ./infra/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - ./infra/clamav/freshclam.prod.conf:/etc/clamav/freshclam.conf:ro
    deploy:
      resources:
        limits: { memory: 3g }
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 10m
      retries: 3

  # Proxy de sortie : seule voie vers Internet du réseau interne. Liste des
  # domaines autorisés dans infra/egress/*.txt ; journal sur la sortie standard.
  egress:
    <<: *hardened
    image: ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
    user: "13:13"
    networks:
      default: {}
      backend: { ipv4_address: 172.31.0.5 }
    tmpfs:
      - /run/squid:uid=13,gid=13
      - /var/spool/squid:uid=13,gid=13
      - /var/log/squid:uid=13,gid=13
      - /tmp:uid=13,gid=13
    volumes:
      - ./infra/egress/squid.conf:/etc/squid/squid.conf:ro
      - ./infra/egress/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro
      - ./infra/egress/knowledge-domains.txt:/etc/squid/knowledge-domains.txt:ro

  web:
    <<: *hardened
    build: { context: ., dockerfile: apps/web/Dockerfile }
    depends_on: [api]
    networks:
      default: {}
      backend: { ipv4_address: 172.31.0.10 }
    ports:
      - "443:8443"
      - "80:8080"
    # nginx (non root) n'écrit que son cache et son PID.
    tmpfs: ["/var/cache/nginx:uid=101,gid=101", "/tmp"]
    volumes:
      - ./infra/tls/web:/etc/nginx/tls:ro

volumes:
  snowfall_clamav_db:
