# Images figées par digest (reproductible, mises à jour par Dependabot).
services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: snowfall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: snowfall
      POSTGRES_USER: snowfall
      POSTGRES_PASSWORD: ${SNOWFALL_DB_PASSWORD:?Define SNOWFALL_DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - snowfall_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snowfall -d snowfall"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741
    container_name: snowfall-keycloak
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?Define KEYCLOAK_ADMIN in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Define KEYCLOAK_ADMIN_PASSWORD in .env}
      # Base PostgreSQL dédiée (créée par npm run db:setup), plus de H2.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Define KEYCLOAK_DB_PASSWORD in .env}
      KC_HEALTH_ENABLED: "true"
      # Substitués dans le realm importé (${...}). Un realm déjà importé n'est
      # pas modifié : appliquer les changements avec npm run keycloak:sync.
      SNOWFALL_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Define OIDC_CLIENT_SECRET in .env}
      SNOWFALL_APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      SNOWFALL_BACKCHANNEL_LOGOUT_URL: ${SNOWFALL_BACKCHANNEL_LOGOUT_URL:-http://host.docker.internal:3001/auth/backchannel-logout}
      SNOWFALL_SMTP_HOST: ${SMTP_HOST:-mailpit}
      SNOWFALL_SMTP_PORT: ${SMTP_PORT:-1025}
      SNOWFALL_SMTP_FROM: ${SMTP_FROM:-no-reply@snowfall.local}
    command: start-dev --import-realm
    ports:
      - "127.0.0.1:8080:8080"
    # Keycloak joint l'API (déconnexion back-channel) sur la machine hôte.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/keycloak/themes:/opt/keycloak/themes:ro
      - ./infra/keycloak/realm:/opt/keycloak/data/import:ro

  # Développement uniquement : capture tous les e-mails (vérification,
  # mot de passe oublié). Interface : http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    container_name: snowfall-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "false"
      MP_MAX_MESSAGES: "500"

  # Antivirus des fichiers reçus. En développement, à lancer à la demande :
  #   docker compose --profile antivirus up -d clamav
  # puis ANTIVIRUS=clamav et CLAMAV_HOST=localhost dans .env.
  # Premier démarrage : téléchargement des signatures (~200 Mo, 1 à 2 min).
  clamav:
    image: clamav/clamav:1.5.4_base@sha256:96b28b83eb72fb497c2400a94229844226e5fe4da9061fad1988092d9fcd88f3
    container_name: snowfall-clamav
    profiles: ["antivirus"]
    restart: unless-stopped
    entrypoint: ["/init-unprivileged"]
    user: "100:101"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:uid=100,gid=101", "/var/log/clamav:uid=100,gid=101"]
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - snowfall_clamav_db:/var/lib/clamav
      - ./infra/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - ./infra/clamav/freshclam.conf:/etc/clamav/freshclam.conf:ro
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 3

  # Recherche web des agents en développement (profil « web-search ») :
  #   docker compose --profile web-search up -d searxng
  # puis WEB_SEARCH_URL=http://127.0.0.1:8888 dans .env. API JSON seule, sur
  # 127.0.0.1 uniquement ; en production, voir compose.prod.yaml (proxy de sortie).
  searxng:
    image: searxng/searxng:2026.10.2-19ffbcd30@sha256:c642712fcedcdaa78fac44f71eada86aff510745826ba1bd1a368211fea2ce7f
    container_name: snowfall-searxng
    profiles: ["web-search"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Define SEARXNG_SECRET in .env}
    tmpfs: ["/tmp", "/var/cache/searxng"]
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./infra/searxng/settings.dev.yml:/etc/searxng/settings.yml:ro

  # ---- Services isolés en développement (profil « code ») ----------------------
  # Interpréteur de code, OCR et décision locale : comme en production, sans
  # réseau, lecture seule, socket Unix réservé à un groupe. Différences de dev :
  # runtime runc (gVisor indisponible sous Docker Desktop : isolation moindre,
  # SANDBOX_REQUIRE_GVISOR=false) et un pont (socat) qui expose les sockets sur
  # 127.0.0.1, car Docker Desktop ne partage pas les sockets Unix avec Windows.
  #   docker compose --profile code up -d --build
  # puis dans .env : SANDBOX_SOCKET=tcp://127.0.0.1:7811, OCR_SOCKET=tcp://127.0.0.1:7812,
  # DECISION_SOCKET=tcp://127.0.0.1:7813 (tcp:// refusé par l'API en production).
  sandbox:
    build: { context: apps/sandbox }
    container_name: snowfall-sandbox
    profiles: ["code"]
    environment:
      SANDBOX_REQUIRE_GVISOR: "false"
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL, CHOWN]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    tmpfs:
      - /work:size=256m,mode=0711
      - /tmp:size=16m,mode=0700
      - /dev/shm:size=16m,mode=0700
    volumes:
      - snowfall_dev_sandbox_socket:/run/sandbox

  ocr:
    build: { context: apps/ocr }
    container_name: snowfall-ocr
    profiles: ["code"]
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL, CHOWN]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    tmpfs:
      - /work:size=512m,mode=0711
      - /tmp:size=16m,mode=0700
    volumes:
      - snowfall_dev_ocr_socket:/run/ocr

  # Décision locale (routage des modèles) : profil à part, l'image pèse ~2,5 Go.
  decision:
    build: { context: apps/decision }
    container_name: snowfall-decision
    profiles: ["decision"]
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    tmpfs:
      - /tmp:size=64m,mode=0700,uid=10201,gid=10201
    volumes:
      - snowfall_dev_decision_socket:/run/decision

  # Pont de développement : 127.0.0.1:7811 → bac à sable, 7812 → OCR, 7813 →
  # décision. Il n'a que les groupes des trois sockets ; les services, eux,
  # restent sans réseau.
  socket-bridge:
    image: alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
    container_name: snowfall-socket-bridge
    profiles: ["code", "decision"]
    user: "10100:10100"
    group_add: ["10010", "10011", "10012"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        socat TCP-LISTEN:7811,fork,reuseaddr UNIX-CONNECT:/run/sandbox/sandbox.sock &
        socat TCP-LISTEN:7812,fork,reuseaddr UNIX-CONNECT:/run/ocr/ocr.sock &
        socat TCP-LISTEN:7813,fork,reuseaddr UNIX-CONNECT:/run/decision/decision.sock &
        wait
    ports:
      - "127.0.0.1:7811:7811"
      - "127.0.0.1:7812:7812"
      - "127.0.0.1:7813:7813"
    volumes:
      - snowfall_dev_sandbox_socket:/run/sandbox
      - snowfall_dev_ocr_socket:/run/ocr
      - snowfall_dev_decision_socket:/run/decision

  # ---- Voix locale en développement (profil « voice ») -------------------------
  # Speaches : transcription (faster-whisper) et synthèse (Kokoro), API audio
  # compatible OpenAI, sur le GPU. Les modèles sont téléchargés une fois (Hugging
  # Face) dans le volume. Rien d'autre ne sort : l'audio reste sur le poste.
  #   docker compose --profile voice up -d speaches
  # puis STT_URL=http://127.0.0.1:8000, TTS_URL=http://127.0.0.1:8000 dans .env.
  speaches:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cuda@sha256:9abc6968a883e77ead9286c38a6ccf3139dcad518b783deeebb7be2ced50e972
    container_name: snowfall-speaches
    profiles: ["voice"]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    gpus: all
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - snowfall_dev_speaches_models:/home/ubuntu/.cache/huggingface/hub

  # ---- Images locales en développement (profil « images ») ---------------------
  # LocalAI : API images compatible OpenAI (/v1/images/generations), sur le GPU.
  # Le modèle est installé une fois depuis la galerie LocalAI dans le volume.
  #   docker compose --profile images up -d localai
  # puis IMAGE_URL=http://127.0.0.1:8090 (8080 est pris par Keycloak) et
  # IMAGE_MODEL=sd-3.5-medium-ggml, installé par POST /models/apply.
  localai:
    image: localai/localai:v4.11.0-gpu-nvidia-cuda-12@sha256:1ee31dce19426ce7948e003bd2143bc88289db984369bdc53179c184d5ad07f9
    container_name: snowfall-localai
    profiles: ["images"]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    gpus: all
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - snowfall_dev_localai_models:/models
      - snowfall_dev_localai_backends:/backends

volumes:
  snowfall_postgres_data:
  snowfall_clamav_db:
  snowfall_dev_sandbox_socket:
  snowfall_dev_ocr_socket:
  snowfall_dev_decision_socket:
  snowfall_dev_speaches_models:
  snowfall_dev_localai_models:
  snowfall_dev_localai_backends:
