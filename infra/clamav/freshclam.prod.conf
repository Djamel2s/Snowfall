# Snowfall — mise à jour des signatures ClamAV en production : uniquement par
# le proxy de sortie (ClamAV n'a aucun autre accès à Internet).
DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
DatabaseMirror database.clamav.net
ScriptedUpdates yes
NotifyClamd /etc/clamav/clamd.conf
Foreground yes
HTTPProxyServer egress
HTTPProxyPort 3128
