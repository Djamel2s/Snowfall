# Snowfall — clamd : analyse des fichiers reçus par l'API (protocole INSTREAM
# sur TCP, réseau interne uniquement). Le conteneur tourne sans privilèges.

Foreground yes
LogTime yes
LogVerbose no
ExtendedDetectionInfo yes
LocalSocket /tmp/clamd.sock
# Toutes les interfaces (IPv4 et IPv6) : le conteneur n'est joignable que
# depuis le réseau interne, et le contrôle de santé interroge localhost.
TCPSocket 3310
DatabaseDirectory /var/lib/clamav

# Fichiers jusqu'à 25 Mo côté API, avec marge ; archives analysées en profondeur.
StreamMaxLength 30M
MaxFileSize 30M
MaxScanSize 200M
MaxRecursion 16
MaxFiles 10000
MaxThreads 4

# Ce qui ne peut pas être analysé est signalé, donc refusé par l'API :
# limites dépassées, archives chiffrées, exécutables corrompus, macros Office.
AlertExceedsMax yes
AlertEncrypted yes
AlertBrokenExecutables yes
AlertOLE2Macros yes
HeuristicAlerts yes
ScanPDF yes
ScanOLE2 yes
ScanHTML yes
ScanArchive yes

# Rechargement des signatures sans doubler la mémoire (conteneur borné).
ConcurrentDatabaseReload no
