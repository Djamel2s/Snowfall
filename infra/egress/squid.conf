# Snowfall — proxy de sortie. En production, l'API et ClamAV sont sur un
# réseau interne sans route vers Internet : ce proxy est leur seule sortie.
# Il résout lui-même les noms et refuse toute destination interne (ce qui
# neutralise aussi le DNS rebinding), n'autorise que des domaines listés,
# et journalise chaque connexion.

http_port 3128

acl backend src 172.31.0.0/24
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

# Destinations internes et réservées : toujours refusées.
acl internal_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12
acl internal_dst dst 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24
acl internal_dst dst 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl internal_dst dst ::1 64:ff9b::/96 100::/64 2001::/23 2001:db8::/32 2002::/16 fc00::/7 fe80::/10 ff00::/8

# Domaines de la plateforme (fournisseurs d'IA, signatures antivirus, IdP…)
# et sites autorisés pour l'import de liens dans les bases de connaissances.
acl platform dstdomain "/etc/squid/allowed-domains.txt"
acl knowledge dstdomain "/etc/squid/knowledge-domains.txt"

http_access deny !backend
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny internal_dst
http_access allow platform
http_access allow knowledge
# Import de liens depuis tout le web public : décommenter la ligne suivante
# (les destinations internes restent refusées par la règle ci-dessus).
# http_access allow backend
http_access deny all

# Aucun cache, aucun en-tête révélant le réseau interne ou la version.
cache deny all
cache_mem 0 MB
forwarded_for delete
via off
httpd_suppress_version_string on
request_header_access X-Forwarded-For deny all
request_header_access Via deny all

# Délais bornés.
connect_timeout 15 seconds
read_timeout 60 seconds
request_timeout 30 seconds

# Journal d'accès sur la sortie standard (collecté avec les autres journaux).
logformat snowfall %ts.%03tu %>a %Ss/%03>Hs %rm %ru %<a %<st
access_log stdio:/dev/stdout snowfall
cache_log stdio:/dev/stderr
cache_store_log none
pid_filename /run/squid/squid.pid
# Pas de sonde ICMP (inutile ici, et demanderait des privilèges).
pinger_enable off
coredump_dir /tmp
