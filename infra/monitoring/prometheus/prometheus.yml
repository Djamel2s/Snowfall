# Snowfall — Prometheus. Collecte sur le réseau interne uniquement.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: snowfall-api
    # Port dédié de l'API (jamais publié par nginx), jeton en plus du réseau.
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:9464"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: monitoring
    static_configs:
      - targets: ["localhost:9090", "alertmanager:9093", "loki:3100"]
