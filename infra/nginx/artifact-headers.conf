# En-têtes du cadre des artifacts (/artifact/). Ce cadre affiche du code écrit
# par un modèle : il est chargé dans une iframe sandbox SANS allow-same-origin
# (origine opaque : aucun accès aux cookies, à l'API ni à l'interface).
#
# Sa CSP autorise les scripts en ligne (le contenu lui-même, à la demande de
# l'utilisateur) mais AUCUN appel réseau, aucun formulaire, aucune ressource
# externe (Mermaid est intégré en ligne à /artifact/mermaid.html).
add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; media-src 'none'; worker-src 'none'; frame-src 'none'; child-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'self'" always;

# Affichable uniquement dans l'interface de Snowfall.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), clipboard-read=(), clipboard-write=(), fullscreen=(), interest-cohort=()" always;
# L'interface exige COEP : le cadre (origine opaque) doit le déclarer aussi, et
# ses fichiers être chargeables par une origine opaque.
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;
add_header Cache-Control "no-cache" always;
