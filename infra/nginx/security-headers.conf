# En-têtes de sécurité de l'interface web. Inclus dans chaque location :
# nginx n'hérite pas des add_header dès qu'un bloc en définit un.

# CSP stricte : aucun script ni style en ligne, aucune origine tierce. Les
# images "data:" et "blob:" servent aux avatars et aux aperçus de pièces
# jointes (générés localement). frame-src 'self' : le seul cadre est celui des
# artifacts (/artifact/), isolé et soumis à sa propre CSP (artifact-headers.conf).
# Les violations sont journalisées par l'API.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; media-src 'self' blob:; worker-src 'none'; frame-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types 'none'; report-uri /api/security/csp-report; report-to csp" always;
add_header Reporting-Endpoints 'csp="/api/security/csp-report"' always;

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
