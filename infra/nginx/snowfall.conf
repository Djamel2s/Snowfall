# Interface web + proxy de l'API (BFF). Seul point exposé à Internet.
server_tokens off;

upstream snowfall_api {
  server api:3001;
  keepalive 16;
}

server {
  listen 8080;
  # Toute requête HTTP est redirigée vers HTTPS.
  return 301 https://$host$request_uri;
}

server {
  listen 8443 ssl;
  http2 on;

  ssl_certificate /etc/nginx/tls/server.crt;
  ssl_certificate_key /etc/nginx/tls/server.key;
  ssl_protocols TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;

  root /usr/share/nginx/html;
  index index.html;

  # Pièces jointes : 10 Mo maximum (limite applicative identique).
  client_max_body_size 11m;

  location /api/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://snowfall_api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    # Réponses diffusées (SSE) : pas de mise en tampon, délai long.
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # Fichiers versionnés par Vite (empreinte dans le nom) : cache long.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Cadre isolé des artifacts : en-têtes propres (pas ceux de l'interface).
  location /artifact/ {
    include /etc/nginx/snippets/artifact-headers.conf;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
