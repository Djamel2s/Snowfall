# SearXNG de DÉVELOPPEMENT (compose.yaml, profil « web-search ») : comme la
# production, sauf la sortie, directe (pas de proxy Squid sur un poste de dev).
# Ne jamais utiliser ce fichier en production (voir settings.yml).
use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - brave
      - qwant
      - mojeek
      - startpage
      - bing
      - wikipedia

# Plusieurs moteurs : un poste de dev se fait vite refuser par un moteur public
# (CAPTCHA, « too many requests ») ; les autres prennent le relais.
engines:
  - name: mojeek
    disabled: false
  - name: startpage
    disabled: false
  - name: bing
    disabled: false

general:
  instance_name: "Snowfall"
  enable_metrics: false

search:
  safe_search: 1
  autocomplete: ""
  # L'API ne répond qu'en JSON (aucune page pour un navigateur).
  formats:
    - json
  # Un moteur qui refuse est suspendu (par défaut 1 h, 24 h pour un CAPTCHA) :
  # quelques refus suffisaient à couper toute la recherche. Courtes en dev.
  suspended_times:
    SearxEngineAccessDenied: 300
    SearxEngineCaptcha: 600
    SearxEngineTooManyRequests: 120
    cf_SearxEngineCaptcha: 600
    cf_SearxEngineAccessDenied: 300
    recaptcha_SearxEngineCaptcha: 600

server:
  # Clé secrète : variable SEARXNG_SECRET (jamais dans ce fichier).
  secret_key: "remplacée-par-SEARXNG_SECRET"
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"

outgoing:
  request_timeout: 5.0
  max_request_timeout: 10.0

ui:
  static_use_hash: true
