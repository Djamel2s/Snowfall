name: CI
on:
  push:
    branches: [main]
  pull_request:

# Actions tierces figées par SHA de commit (une étiquette peut être déplacée) ;
# Dependabot les met à jour. Permissions minimales, élargies job par job.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: snowfall
          POSTGRES_USER: snowfall
          POSTGRES_PASSWORD: ci_only_superuser_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U snowfall -d snowfall"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_ADMIN_URL: postgresql://snowfall:ci_only_superuser_password@127.0.0.1:5432/snowfall
      DATABASE_MIGRATION_URL: postgresql://snowfall_migrator:ci_only_migrator_password@127.0.0.1:5432/snowfall
      DATABASE_URL: postgresql://snowfall_app:ci_only_app_password_123@127.0.0.1:5432/snowfall
      KEYCLOAK_DB_PASSWORD: ci_only_keycloak_password
      # Les tests d'intégration tournent avec le rôle applicatif (RLS active).
      TEST_DATABASE_URL: postgresql://snowfall_app:ci_only_app_password_123@127.0.0.1:5432/snowfall
      TEST_DATABASE_MIGRATION_URL: postgresql://snowfall_migrator:ci_only_migrator_password@127.0.0.1:5432/snowfall
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:setup
      - run: npm run db:migrate
      - run: npm run db:check
      - run: npm run check:api
      - run: npm run lint:web
      - run: npm test -w @snowfall/web
      - run: npm run build:web
      - run: npm audit --audit-level=high

  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Inventaire des dépendances de production (CycloneDX), produit par npm lui-même.
      - run: npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f apps/api/Dockerfile --target runtime -t snowfall-api:ci .
      - run: docker build -f apps/web/Dockerfile -t snowfall-web:ci .
      - run: docker build -t snowfall-sandbox:ci apps/sandbox
      - run: docker build -t snowfall-ocr:ci apps/ocr
      - run: docker build -t snowfall-decision:ci apps/decision
      # Vulnérabilités connues des images (système et dépendances embarquées).
      - name: Scan de l'image API
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: snowfall-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan de l'image web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: snowfall-web:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan de l'image du bac à sable
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: snowfall-sandbox:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan de l'image OCR
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: snowfall-ocr:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan de l'image de décision
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: snowfall-decision:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      # Décision dans son image, sans réseau : entrées hostiles, identité, et
      # mesure du routage sur le jeu tenu à l'écart (régression du modèle = échec).
      - name: Tests du service de décision
        run: docker run --rm --network none --read-only --tmpfs /run/decision:uid=10201,gid=10012,mode=0750 --tmpfs /tmp -v "$PWD/apps/decision:/t:ro" -v "$PWD/apps/api/src/decision:/cases:ro" snowfall-decision:ci python3 -I /t/decision_test.py
      # OCR dans son image, sans réseau : scan lu, fichier corrompu, utilisateur
      # dédié, environnement nettoyé, délai.
      - name: Tests de l'OCR
        run: docker run --rm --network none --read-only --tmpfs /work --tmpfs /tmp -v "$PWD/apps/ocr:/t:ro" snowfall-ocr:ci python3 -I /t/ocr_test.py
      # Le bac à sable durci comme en production, attaqué : réseau, identité,
      # socket de l'API, écriture, ressources, survie, fuite entre exécutions.
      - name: Batterie d'attaques du bac à sable
        run: bash scripts/sandbox-attack.sh
      # Mauvaises configurations (Dockerfiles, compose) et secrets dans le dépôt.
      - name: Scan de configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  # Tests d'écran : l'interface dans un vrai navigateur (bureau et mobile),
  # l'API remplacée par des réponses fictives.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx -w @snowfall/web playwright install --with-deps chromium
      - run: npm run e2e -w @snowfall/web
        env:
          CI: "true"

  # Parcours sur la VRAIE pile (Keycloak + TOTP, API, Postgres) : pile jetable,
  # secrets générés, puis vérifications en base (chiffré au repos, RLS, audit).
  e2e-real:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx -w @snowfall/web playwright install --with-deps chromium
      - run: npm run e2e:real
        env:
          CI: "true"

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
